openapi: '3.0.3'
info:
  title: Katalog API
  version: '1.0'
servers:
  - url: https://localhost:50001
tags:
  - name: Shop
paths:
  /articles:
    get:
      tags:
        - Shop
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleResponse'
    post:
      tags:
        - Shop
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleResponse'


components:
  schemas:
    Id:
      type: string
      format: uuid
      maxLength: 36
    Name:
          type: string
          maxLength: 300
    Price:
      type: number
      format: float
      minimum: 0
      maximum: 10000
    ArticleRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        price:
          $ref: '#/components/schemas/Price'
      required:        
        - name
        - price
    ArticleResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/Name'
        price:
          $ref: '#/components/schemas/Price'
      required:
        - id      
        - name
        - price